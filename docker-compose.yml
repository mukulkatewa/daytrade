services:
  postgres:
    image: postgres:16-alpine
    container_name: daytrade-postgres
    environment:
      POSTGRES_USER: daytrade
      POSTGRES_PASSWORD: daytrade
      POSTGRES_DB: daytrade
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daytrade -d daytrade"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
